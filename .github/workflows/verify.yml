name: Verify hosted ledger keyboard flow
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test the public demo with synthetic local browser state
        env:
          ACCESSROUTE_TEST_URL: https://sharonbasovich.github.io
          ACCESSROUTE_ENTRY_PATH: /accessroute/
        run: npm run test:e2e -- tests/ledger-focus.spec.js
