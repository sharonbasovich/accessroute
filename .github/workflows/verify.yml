name: Verify prototype
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p evidence output/pdf
      - run: npm run test:e2e
      - run: python -m pip install -r scripts/requirements-pdf.txt
      - run: python scripts/check-adversarial-pdfs.py
      - name: Verify production browser flows and PDFs
        run: |
          mv evidence evidence-development
          mkdir -p evidence
          node serve.mjs > /tmp/accessroute-production-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null
          ACCESSROUTE_TEST_URL=http://127.0.0.1:4173 npm run test:e2e
          python scripts/check-adversarial-pdfs.py
